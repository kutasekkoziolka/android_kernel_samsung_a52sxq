name: Build Samsung A52s Kernel

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main, test ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name'
        required: false
        default: ''

env:
  KERNEL_DEFCONFIG: vendor/a52sxq_eur_open_defconfig
  ARCH: arm64
  SUBARCH: arm64
  ANDROID_MAJOR_VERSION: r
  PLATFORM_VERSION: 11

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          git \
          wget \
          zip \
          python3 \
          python3-pip \
          ccache

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Download and setup toolchain
      run: |
        # Download Android NDK for cross-compilation
        wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip -q android-ndk-r25c-linux.zip
        
        # Alternative: Download prebuilt GCC toolchain
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain
        
        # Setup environment
        echo "CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-" >> $GITHUB_ENV
        echo "CC=ccache $(pwd)/toolchain/bin/aarch64-linux-android-gcc" >> $GITHUB_ENV
        echo "PATH=$(pwd)/toolchain/bin:$PATH" >> $GITHUB_ENV

    - name: Setup kernel build environment
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=${{ env.CROSS_COMPILE }}
        
        # Make build script executable
        chmod +x build_kernel.sh

    - name: Clean previous builds
      run: |
        make clean
        make mrproper

    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=${{ env.CROSS_COMPILE }}
        make ${{ env.KERNEL_DEFCONFIG }}

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=${{ env.CROSS_COMPILE }}
        export LOCALVERSION="-github-$(date +%Y%m%d)"
        
        # Build using the original script
        ./build_kernel.sh
        
        # Alternative direct build
        # make -j$(nproc) Image.gz dtbo.img

    - name: Check build artifacts
      run: |
        ls -la arch/arm64/boot/
        ls -la out/ || echo "No out directory"
        
        # Find built kernel image
        find . -name "Image.gz" -type f
        find . -name "*.img" -type f
        find . -name "*.dtb" -type f

    - name: Prepare release artifacts
      run: |
        mkdir -p release
        
        # Copy kernel image
        if [ -f arch/arm64/boot/Image.gz ]; then
          cp arch/arm64/boot/Image.gz release/
        fi
        
        # Copy device tree blobs
        if [ -f arch/arm64/boot/dtbo.img ]; then
          cp arch/arm64/boot/dtbo.img release/
        fi
        
        # Copy any other artifacts from build script
        if [ -d out ]; then
          cp -r out/* release/ 2>/dev/null || true
        fi
        
        # Create build info
        echo "Build Date: $(date)" > release/build_info.txt
        echo "Commit: ${{ github.sha }}" >> release/build_info.txt
        echo "Branch: ${{ github.ref_name }}" >> release/build_info.txt
        
        # Create flashable zip structure (optional)
        mkdir -p release/anykernel3
        
        ls -la release/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: samsung-a52s-kernel-${{ github.sha }}
        path: release/
        retention-days: 30

    - name: Create Release
      if: github.event.inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
        name: Samsung A52s Kernel ${{ github.event.inputs.release_tag || github.ref_name }}
        body: |
          ## Samsung Galaxy A52s 5G Custom Kernel
          
          **Build Information:**
          - Commit: ${{ github.sha }}
          - Date: ${{ github.run_id }}
          - Config: ${{ env.KERNEL_DEFCONFIG }}
          
          **Installation:**
          1. Download the kernel files
          2. Flash using ODIN or custom recovery
          3. Reboot device
          
          **Warning:** Flashing custom kernels may void warranty and can brick your device.
        files: |
          release/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-with-anykernel:
    runs-on: ubuntu-22.04
    needs: build
    if: success()
    
    steps:
    - name: Checkout AnyKernel3
      uses: actions/checkout@v4
      with:
        repository: osm0sis/AnyKernel3
        path: anykernel3

    - name: Download kernel artifacts
      uses: actions/download-artifact@v4
      with:
        name: samsung-a52s-kernel-${{ github.sha }}
        path: kernel_files

    - name: Setup AnyKernel3 for A52s
      run: |
        cd anykernel3
        
        # Configure for Samsung A52s
        cat > anykernel.sh << 'EOF'
        properties() {
        kernel.string=Samsung A52s Custom Kernel
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=a52sxq
        device.name2=SM-A528B
        device.name3=SM-A528N
        supported.versions=11-13
        supported.patchlevels=
        }
        
        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;
        
        . tools/ak3-core.sh;
        
        chmod 644 $ramdisk/*;
        patch_dtbo;
        write_boot;
        EOF
        
        # Copy kernel files
        cp ../kernel_files/Image.gz ./ 2>/dev/null || echo "No Image.gz found"
        cp ../kernel_files/dtbo.img ./ 2>/dev/null || echo "No dtbo.img found"
        
        # Create flashable zip
        zip -r9 ../samsung-a52s-kernel-anykernel.zip * -x .git README.md *placeholder

    - name: Upload AnyKernel3 zip
      uses: actions/upload-artifact@v4
      with:
        name: samsung-a52s-anykernel-${{ github.sha }}
        path: samsung-a52s-kernel-anykernel.zip
