name: Build Samsung A52s Kernel

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main, test ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name'
        required: false
        default: ''

env:
  KERNEL_DEFCONFIG: vendor/a52sxq_eur_open_defconfig
  ARCH: arm64
  SUBARCH: arm64
  ANDROID_MAJOR_VERSION: r
  PLATFORM_VERSION: 11

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          git \
          wget \
          zip \
          python3 \
          ccache

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Setup Proton-Clang 12.0.7 and GCC toolchain
      run: |
        mkdir -p toolchain

        echo "=== Pobieranie Proton-Clang 12.0.7 ==="
        mkdir -p toolchain/clang-12.0.7
        cd toolchain/clang-12.0.7
        wget -q --show-progress https://github.com/kdrag0n/proton-clang/releases/download/2021-09-16/clang-12.0.7.tar.gz
        tar -xzf clang-12.0.7.tar.gz
        rm clang-12.0.7.tar.gz
        cd ../..

        echo "=== Pobieranie GCC 4.9 ==="
        git clone --depth=1 https://github.com/RyuujiX/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/google

        echo "=== Sprawdzanie toolchainów ==="
        ls -l toolchain/clang-12.0.7/bin/clang
        ls -l toolchain/google/aarch64-linux-android-4.9/bin/

    - name: Build kernel
      run: |
        chmod +x build_kernel.sh
        ./build_kernel.sh

    - name: Prepare artifacts
      run: |
        mkdir -p release
        if [ -f arch/arm64/boot/Image ]; then
          cp arch/arm64/boot/Image release/
        fi
        if [ -f arch/arm64/boot/Image.gz ]; then
          cp arch/arm64/boot/Image.gz release/
        fi
        if [ -d export ]; then
          cp -r export/* release/ 2>/dev/null || true
        fi
        echo "Build date: $(date)" > release/build_info.txt
        echo "Commit: ${{ github.sha }}" >> release/build_info.txt
        echo "Branch: ${{ github.ref_name }}" >> release/build_info.txt
        ls -la release/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: samsung-a52s-kernel-${{ github.sha }}
        path: release/
        retention-days: 30

    - name: Create Release (if tag or manual)
      if: github.event.inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
        name: Samsung A52s Kernel ${{ github.event.inputs.release_tag || github.ref_name }}
        body: |
          **Samsung Galaxy A52s 5G Custom Kernel**
          - Commit: ${{ github.sha }}
          - Defconfig: ${{ env.KERNEL_DEFCONFIG }}
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-with-anykernel:
    runs-on: ubuntu-22.04
    needs: build
    if: success()
    steps:
    - name: Checkout AnyKernel3
      uses: actions/checkout@v4
      with:
        repository: osm0sis/AnyKernel3
        path: anykernel3

    - name: Download kernel artifact
      uses: actions/download-artifact@v4
      with:
        name: samsung-a52s-kernel-${{ github.sha }}
        path: kernel_files

    - name: Prepare AnyKernel3 zip
      run: |
        cd anykernel3
        cat > anykernel.sh << 'EOF'
        properties() {
        kernel.string=Samsung A52s Custom Kernel
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=a52sxq
        device.name2=SM-A528B
        device.name3=SM-A528N
        supported.versions=11-13
        }
        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;
        . tools/ak3-core.sh;
        chmod 644 $ramdisk/*;
        patch_dtbo;
        write_boot;
        EOF

        if [ -f ../kernel_files/Image ]; then
          cp ../kernel_files/Image .
        elif [ -f ../kernel_files/Image.gz ]; then
          cp ../kernel_files/Image.gz .
        fi

        if [ -f ../kernel_files/dtbo.img ]; then
          cp ../kernel_files/dtbo.img .
        fi

        zip -r9 ../samsung-a52s-anykernel.zip * -x .git README.md *placeholder

    - name: Upload AnyKernel3 zip
      uses: actions/upload-artifact@v4
      with:
        name: samsung-a52s-anykernel-${{ github.sha }}
        path: samsung-a52s-anykernel.zip